name: Release

# Fires when a version tag (e.g. 0.1.0) is pushed. Modeled on
# domainaware/parsedmarc's release.yml -- the two verification steps
# (tag-matches-version, changelog-section-exists) are cheap and prevent the
# two most common botched releases.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag and changelog
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches dbt_project.yml version
        run: |
          version="$(grep -m1 "^version:" dbt_project.yml | sed -E "s/version: *['\"]?([^'\"]+)['\"]?/\1/")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match dbt_project.yml version ($version)" >&2
            exit 1
          fi

      - name: Verify CHANGELOG.md has a section for this version
        run: |
          if ! grep -q "^## $GITHUB_REF_NAME" CHANGELOG.md; then
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi

  github-release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog notes
        run: |
          awk -v ver="$GITHUB_REF_NAME" '
            index($0, "## " ver) == 1 {found=1; next}
            /^## / && found {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
