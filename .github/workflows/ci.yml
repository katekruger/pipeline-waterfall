name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# dbt-version matrix. requirements.txt (exact pins) is still what local
# development uses -- see AGENTS.md/CONTRIBUTING.md -- CI overrides the dbt
# version per matrix leg instead, to actually exercise the
# require-dbt-version range (">=1.10.0", "<3.0.0") declared in
# dbt_project.yml, not just the one version a contributor happens to have
# pinned locally.
jobs:
  dbt-build:
    name: dbt build (DuckDB, dbt ${{ matrix.dbt-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dbt-version: "1.10.9"
            dbt-duckdb-version: "1.10.1"
          - dbt-version: "1.12.3"
            dbt-duckdb-version: "1.11.0"
    defaults:
      run:
        working-directory: integration_tests
    env:
      DBT_DUCKDB_PATH: ci.duckdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install dbt ${{ matrix.dbt-version }}
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt --version

      - name: dbt deps
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt deps

      # Cold-warehouse checks (ENG-7e/ADR 0007): these MUST run before `dbt
      # build` below creates ${{ env.DBT_DUCKDB_PATH }} -- run_query() calls
      # at compile time (int_waterfall__period_boundaries.sql and the
      # waterfall__cohort_mode = 'current_state' lookup) used to fail here,
      # because `execute` is True for both of these commands even though no
      # relation has been built yet.
      - name: dbt compile (cold warehouse)
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt compile

      - name: dbt docs generate (cold warehouse)
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt docs generate

      - name: Remove cold-warehouse artifact
        run: rm -f "$DBT_DUCKDB_PATH"

      - name: dbt build
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt build

      # current_state must reconcile across repeated runs, not just once
      # (ENG-7b/ADR 0007) -- a documented config option that reconciles on
      # the first run and breaks (or silently diverges) on the second is
      # exactly the "silently wrong number" failure mode this package
      # exists to refuse.
      - name: dbt build (current_state, run 1)
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt build --vars '{waterfall__cohort_mode: current_state}'

      - name: dbt build (current_state, run 2)
        run: uv run --python 3.12 --with "dbt-core==${{ matrix.dbt-version }}" --with "dbt-duckdb==${{ matrix.dbt-duckdb-version }}" dbt build --vars '{waterfall__cohort_mode: current_state}'
