name: 'pipeline_waterfall_integration_tests'
version: '0.1.0'
config-version: 2

profile: 'pipeline_waterfall_integration_tests'

flags:
  send_anonymous_usage_stats: false
  require_ref_searches_node_package_before_root: True

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # This project's seed data is shaped as if Fivetran History Mode were
  # actually enabled -- salesforce_history_enabled (models/preflight/) would
  # otherwise correctly fail this build, since the var it checks defaults to
  # false upstream.
  salesforce__opportunity_history_enabled: true
  # waterfall__period_grain is intentionally NOT overridden here (was
  # ['month'] only, pre-ENG-7e) -- the package default (['month',
  # 'quarter']) needs real quarter-grain data to actually exercise, and an
  # override that silently dropped 'quarter' from every CI run meant the
  # quarterly bridge was never once tested end to end. The seed
  # (integration_tests/seeds/salesforce__opportunity_daily_history.csv)
  # now carries anchor snapshots through 2026-07-01 (two real quarters)
  # specifically so this default can run for real -- see ADR 0009.
  # Test-harness-only override of the package default (2). This project's
  # fixtures only span one real month (January -> February) by design.
  # Extending the seed backward to satisfy the default threshold was tried
  # and reverted: it creates the exact "created" landmine fixture 4 exists
  # to catch -- every other fixture's first row would land exactly at a new
  # period boundary, absent-then-present with a created_date that doesn't
  # match that period, a real bridge_amount with no bucket to explain it
  # (see int_waterfall__transitions.sql and ADR 0004). Lowering the
  # threshold to match this harness's genuinely minimal, deliberately
  # sparse fixture span is more honest than bloating the seed just to
  # satisfy this one check. Do not carry this into the package's own
  # dbt_project.yml default -- a real user's continuous history is exactly
  # what history_depth needs to check meaningfully.
  waterfall__min_history_periods: 1
  # Acknowledges that integration_tests/seeds/ deliberately contains two
  # currencies (fixture 20) -- multi_currency_unguarded only fires when this
  # is unset. Real multi-currency conversion is v0.2; this is not that, it's
  # just "yes, I know" for a fixture that predates the check.
  waterfall__currency_mode: 'unconverted'

seeds:
  pipeline_waterfall_integration_tests:
    salesforce__opportunity_daily_history:
      +column_types:
        date_day: date
        amount: double
        close_date: date
        created_date: date
        is_closed: boolean
        is_deleted: boolean
        is_won: boolean
