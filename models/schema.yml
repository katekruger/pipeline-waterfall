version: 2

models:
  - name: int_waterfall__daily_state
    description: >
      THE CONTRACT. One row per entity_id per date_day, normalized from
      whichever history source `waterfall__history_source` selects. Every
      model downstream of this one reads only from here -- this is what
      makes the package CRM-agnostic. See BUILD-PLAN.md §5 for the full
      architecture and the source of this column list.
    columns:
      - name: daily_state_id
        description: Surrogate key of (entity_id, date_day, source_relation). Unique key for incremental loads.
        data_tests:
          - unique
          - not_null

      - name: entity_id
        description: The opportunity (or deal) id from the source CRM.
        data_tests:
          - not_null

      - name: date_day
        description: The calendar day this row's state is observed on.
        data_tests:
          - not_null

      - name: source_relation
        description: >
          Multi-connector union key. HubSpot's Fivetran models carry this
          column; Salesforce's do not, so the Salesforce adapter defaults it
          to '' rather than NULL, keeping grain comparisons well-defined
          across every adapter.
        data_tests:
          - not_null

      - name: stage
        description: The opportunity/deal's stage name as of this date_day.

      - name: stage_order
        description: >
          Resolved by joining `stage` against the seed named by
          `waterfall__stage_order_seed` (default `waterfall_stage_order`).
          NULL when the observed stage isn't present in that seed -- see
          fixture 19 and ADR 0002. The `stage_order_complete` preflight test
          (Prompt 3) fails the build loudly when this happens rather than
          silently treating a missing stage as unordered.

      - name: amount
        description: >
          The opportunity amount, read from the column named by
          `waterfall__amount_column` (default `amount`; commonly overridden
          to a custom ARR field -- see fixture 20 and BUILD-PLAN.md §7 on
          Salesforce amount being derived from line items).

      - name: currency_code
        description: >
          Nullable in v0.1. Fivetran's Salesforce package does not select
          CurrencyIsoCode by default -- this is the multi-currency landmine
          documented in BUILD-PLAN.md §7. Populated only when the org has
          added `currency_iso_code` to
          `salesforce__opportunity_pass_through_columns`; see fixture 20.

      - name: close_date
        description: The expected or actual close date as of this date_day.

      - name: is_closed
        description: Whether the opportunity was closed (won or lost) as of this date_day.
        data_tests:
          - not_null

      - name: is_won
        description: Whether the opportunity was won as of this date_day.
        data_tests:
          - not_null

      - name: owner_id
        description: The opportunity owner as of this date_day.

      - name: created_date
        description: The opportunity's creation date. Constant across every date_day row for a given entity_id.
        data_tests:
          - not_null

      - name: is_deleted
        description: >
          Flows through from the source untouched -- never filtered at
          staging. A deal soft-deleted mid-period must stay visible here or
          it vanishes retroactively from history and breaks bridge
          reconciliation. See fixture 15.
        data_tests:
          - not_null

  - name: int_waterfall__period_boundaries
    description: >
      One row per period per grain in `waterfall__period_grain` (default
      month and quarter), spanning the date range actually present in
      `int_waterfall__daily_state`. `period_end` is the next period's
      `period_start` -- a telescoping boundary, since a period's closing
      state is the next period's opening state. The trailing partial period
      per grain is dropped since its end isn't known yet.
    columns:
      - name: period_grain
        description: "'month' or 'quarter' (whichever grains are in `waterfall__period_grain`)."
        data_tests:
          - not_null
      - name: period_start
        description: The first day of the period (inclusive).
        data_tests:
          - not_null
      - name: period_end
        description: The first day of the next period (exclusive) -- i.e. this period's own closing snapshot date.
        data_tests:
          - not_null

  - name: int_waterfall__transitions
    description: >
      One row per (entity_id, source_relation, period_grain, period_start)
      for every entity present at period start, period end, or both --
      including rows where `movement_bucket` is NULL, meaning nothing that
      affects bridge dollars changed (see ADR 0002 and ADR 0003). This is
      the raw comparison layer; `waterfall__movement_detail` filters to
      classified rows only. See BUILD-PLAN.md §5 "Movement classification --
      the rules" and `macros/classify_movement.sql`.
    columns:
      - name: entity_id
        description: Opportunity/deal id, as in the contract.
      - name: movement_bucket
        description: >
          One of the ten buckets (`created, won, lost, reopened, pushed,
          pulled_in, slipped, advanced, expanded, contracted`), or NULL if
          nothing classifiable changed between t0 and t1.

  - name: waterfall__movement_detail
    description: >
      One row per opportunity per period per bucket -- only rows where
      `int_waterfall__transitions.movement_bucket` is not null. Both a
      count (implicit: one row per deal) and a dollar variant
      (`movement_amount`) are available on every bucket; see
      `waterfall__bridge_monthly`/`waterfall__bridge_quarterly` for the
      aggregated form. Incremental, unique key
      `(entity_id, source_relation, period_grain, period_start)` -- see the
      model's own header comment and ADR 0003 for why `period_grain` is in
      the key even though BUILD-PLAN.md §5's literal spec omits it.
    columns:
      - name: movement_detail_id
        description: Surrogate key of (entity_id, source_relation, period_grain, period_start).
        data_tests:
          - unique
          - not_null
      - name: entity_id
        description: The opportunity/deal id, as in the contract (`int_waterfall__daily_state`).
      - name: source_relation
        description: Multi-connector union key, as in the contract. `''` for Salesforce in v0.1.
      - name: period_grain
        description: "'month' or 'quarter' (whichever grains are in `waterfall__period_grain`)."
      - name: period_start
        description: The first day of the period (inclusive) this movement was classified in.
      - name: period_end
        description: The first day of the next period (exclusive) -- this period's t1 snapshot date.
      - name: movement_bucket
        description: One of the ten buckets. Never NULL in this model (unlike `int_waterfall__transitions`) -- unclassified rows are filtered out here.
        data_tests:
          - not_null
      - name: movement_amount
        description: >
          A BUSINESS-REPORTING figure ("how big was the deal that
          won/expanded/..."), not a reconciling one. For
          `expanded`/`contracted`, the signed delta (t1 amount - t0
          amount). For every other bucket, the relevant amount at t1 --
          except `won`/`lost`, which respect
          `waterfall__amount_change_precedence` (see ADR 0003). Do not sum
          this across buckets expecting it to tie to opening/closing
          pipeline -- it will not. See `bridge_amount` for that, and ADR
          0005 (ENG-7a) for why the two deliberately diverge.

      - name: bridge_amount
        description: >
          THE COLUMN TO CHART. The actual signed open-pipeline delta this
          row is responsible for -- sum this across buckets for any period
          and it equals that period's closing pipeline minus opening
          pipeline, exactly (asserted by `bridge_reconciles` here and by
          `mart_bridge_reconciles` again at the
          `waterfall__bridge_monthly`/`waterfall__bridge_quarterly` layer).
          Deliberately different from `movement_amount` -- see ADR 0004
          and ADR 0005 (ENG-7a).

      - name: stage
        description: The opportunity/deal's stage name at t1 (period end).
      - name: currency_code
        description: The opportunity/deal's currency code at t1. Nullable in v0.1 -- see the contract's own `currency_code` column.

  - name: waterfall__bridge_monthly
    description: >
      `waterfall__movement_detail` aggregated to (period_start, period_end,
      movement_bucket) at monthly grain: `movement_count`,
      `movement_amount`, and `bridge_amount` per bucket per period. Bridge
      reconciliation (opening + movements = closing, exactly) is asserted
      by `bridge_reconciles` (against `waterfall__movement_detail`) and
      `mart_bridge_reconciles` (against this model's own `bridge_amount`),
      not by this model itself.
    columns:
      - name: period_start
        description: The first day of the period (inclusive).
      - name: period_end
        description: The first day of the next period (exclusive).
      - name: movement_bucket
        description: One of the ten movement buckets.
      - name: movement_count
        description: Number of opportunities/deals classified into this bucket this period.
      - name: movement_amount
        description: >
          A BUSINESS-REPORTING figure, not a reconciling one -- see the
          identically-named column on `waterfall__movement_detail`. Do not
          chart this expecting a waterfall to tie out; use `bridge_amount`.
      - name: bridge_amount
        description: >
          THE COLUMN TO CHART. Sum this across every `movement_bucket` for
          a given period and it equals that period's closing pipeline
          minus opening pipeline, exactly -- see `mart_bridge_reconciles`
          and ADR 0005 (ENG-7a).

  - name: waterfall__bridge_quarterly
    description: Same shape as `waterfall__bridge_monthly`, at quarterly grain.
    columns:
      - name: period_start
        description: The first day of the period (inclusive).
      - name: period_end
        description: The first day of the next period (exclusive).
      - name: movement_bucket
        description: One of the ten movement buckets.
      - name: movement_count
        description: Number of opportunities/deals classified into this bucket this period.
      - name: movement_amount
        description: >
          A BUSINESS-REPORTING figure, not a reconciling one -- see the
          identically-named column on `waterfall__movement_detail`. Do not
          chart this expecting a waterfall to tie out; use `bridge_amount`.
      - name: bridge_amount
        description: >
          THE COLUMN TO CHART. Sum this across every `movement_bucket` for
          a given period and it equals that period's closing pipeline
          minus opening pipeline, exactly -- see `mart_bridge_reconciles`
          and ADR 0005 (ENG-7a).
